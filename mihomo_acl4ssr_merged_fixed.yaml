    proxies: ["🚀 节点选择", "♻️ 自动选择", DIRECT, "🇭🇰 香港节点", "🇨🇳 台湾节点", "🇸🇬 狮城节点", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇰🇷 韩国节点", "🇹🇷 土耳其节点", "🇲🇴 澳门节点", "🚀 手动切换"]
