    interval: 300
    tolerance: 50
  - name: "🇨🇳 台湾节点"
    type: url-test
    include-all: true
    filter: "(?i)台|新北|彰化|TW|Taiwan"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - name: "🇸🇬 狮城节点"
    type: url-test
    include-all: true
    filter: "(?i)新加坡|坡|狮城|SG|Singapore"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - name: "🇰🇷 韩国节点"
