  - name: "🇲🇴 澳门节点"
    type: url-test
    include-all: true
    filter: "(?i)澳门|澳門|Macao|Macau|🇲🇴"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - name: "🎥 奈飞节点"
    type: select
    include-all: true
    filter: "(?i)Netflix|奈飞|奈飛|NF"

